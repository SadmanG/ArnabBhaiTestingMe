<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Navigable Website (with nav, form)</title>
</head>

<body>
    <h1>IIUC Fokira Student Portal</h1>
    <nav>
        <a href="">
            <li>Home</li>
        </a>
        <a href="">
            <li>Products</li>
        </a>
        <a href="">
            <li>Contact</li>
        </a>
        <a href="">
            <li>Review</li>
        </a>
    </nav>
    <form action="SDclass1.html">
        <fieldset>
            <legend>Welcome to Software Development registration</legend>
            <label for="fname">First name:</label><br>
            <input type="text" id="fname" name="fname" required><br>
            <label for="lname">Last name:</label><br>
            <input type="text" id="lname" name="lname" required><br>
            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required><br>
            <label for="file">File:</label>
            <input type="file" id="file" name="file"><br>
            <legend>Choose Your Language :</legend>
            <input type="radio" id="html" name="fav_language" value="HTML" required>
            <label for="html">HTML</label><br>
            <input type="radio" id="css" name="fav_language" value="CSS">
            <label for="css">CSS</label><br>
            <input type="radio" id="javascript" name="fav_language" value="JavaScript">
            <label for="javascript">JavaScript</label>
        </fieldset>
        <button>Go to SDclass1.</button>
    </form>
    <main>
        <table>
            <tr>
                <th>1st Period</th>
                <th>2nd Period</th>
                <th>3rd Period</th>
            </tr>
            <tr>
                <td>MATH</td>
                <td>DSA</td>
                <td>SD</td>
            </tr>
            <tr>
                <td>CHEM</td>
                <td>GEED</td>
                <td>CSE</td>
            </tr>
        </table>
    </main>
</body>

</html>
